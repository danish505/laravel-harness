#web_search = "disabled"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800

[agents.planner]
description = "Plans changes and writes the plan artifact for the current Laravel Harness V2 run."
config_file = "agents/planner.toml"

[agents.implementer]
description = "Implements the approved plan with minimal safe changes for the current Laravel Harness V2 run."
config_file = "agents/implementer.toml"

[agents.tester]
description = "Runs focused tests and writes the test-results artifact for the current Laravel Harness V2 run."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Reviews the diff, test results, conventions, and approval state for the current Laravel Harness V2 run."
config_file = "agents/reviewer.toml"

[apps._default]
enabled = false
default_tools_enabled = false
open_world_enabled = false
destructive_enabled = false

