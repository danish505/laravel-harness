#web_search = "disabled"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800

[agents.planner]
description = "Plans Laravel 7 / PHP 7.4 changes and writes harness/plans/plan.md."
config_file = "agents/planner.toml"

[agents.implementer]
description = "Implements the approved Laravel plan with minimal safe changes."
config_file = "agents/implementer.toml"

[agents.tester]
description = "Runs focused PHPUnit/build/browser checks and writes test results."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Reviews the diff, test results, Laravel conventions, and approval state."
config_file = "agents/reviewer.toml"

[apps._default]
enabled = false
default_tools_enabled = false
open_world_enabled = false
destructive_enabled = false

#[mcp_servers._default]
#enabled = false

#[mcp_servers.figma]
#enabled = false

#[mcp_servers.playwright]
#enabled = false

#[mcp_servers.chrome_devtools]
#enabled = false

#[mcp_servers.github]
#enabled = false
